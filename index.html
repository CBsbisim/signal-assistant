<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Signal assistant</title>
<style>
 body{font:16px/1.5 system-ui,Arial,sans-serif;margin:0;display:grid;grid-template-columns:2fr 420px;min-height:100vh}
 main{padding:24px;border-right:1px solid #ddd} aside{padding:24px;background:#f5f7f8}
 .turn{margin:8px 0;padding:10px 14px;border-radius:12px;background:#eef1f3;max-width:80%}
 .me{background:#003b5c;color:#fff;margin-left:auto}
 button{margin:4px 6px 0 0;padding:8px 12px;border:1px solid #00694e;background:#fff;border-radius:18px;cursor:pointer}
 .card{padding:12px;border-radius:10px;background:#d6e8e2;margin-bottom:12px} .note{color:#4a4a4a;font-size:14px}
 .warning{padding:12px;border-left:4px solid #a54100;background:#fff1e8;color:#5c2500}
 input{width:90%;padding:8px;font:inherit;border:1px solid #bbb;border-radius:8px}
 .signal{padding:14px;border-radius:10px;background:#fff;border:1px solid #ccc;margin-bottom:12px}
 .signal h3{margin:0 0 6px} .ev{margin:8px 0;padding:6px 10px;border-left:4px solid #999}
 .ev.positive{border-left-color:#00694e} .ev.negative{border-left-color:#a54100}
 .detail{margin-top:10px;padding:10px;background:#f5f7f8;border-radius:8px}
 .detail table{border-collapse:collapse;font-size:14px} .detail th,.detail td{text-align:left;padding:3px 8px;border-bottom:1px solid #ddd}
 @media(max-width:700px){body{grid-template-columns:1fr}main{border-right:0;border-bottom:1px solid #ddd;padding:16px}aside{padding:16px}input{box-sizing:border-box}}
</style>
<main>
  <h1>Signal assistant</h1>
  <p class="note">Simulated data. Covers two stocks: XYZ and ABC. Gives a buy / hold / sell signal with its evidence; you make the decision.</p>
  <div id="transcript"></div>
  <p><button onclick="send('Is XYZ worth buying? I would hold 6 months.')">Try: XYZ, 6 months</button>
  <button onclick="send('How does ABC look for 1 year?')">Try: ABC, 1 year</button></p>
  <p><input id="msg" placeholder="Ask about XYZ or ABC, e.g. 'Is XYZ worth buying for 6 months?'" autofocus></p>
</main>
<aside>
  <h2>Result</h2>
  <div id="card"><p class="note">Nothing yet.</p></div>
</aside>
<script>
const t = document.getElementById('transcript'), card = document.getElementById('card');
let detailed = false;   // Step 4: brief by default; the person opts in to the detail
let lastCard = null;
function say(text, me){ const d=document.createElement('div'); d.className='turn'+(me?' me':''); d.textContent=text; t.appendChild(d); }
function render(data){                       // the fields, drawn — not the reply, printed
  card.innerHTML = '';
  if (data.action) { const c=document.createElement('div'); c.className='card';
    c.textContent = data.action.clinic + ' · ' + data.action.date + ' ' + (data.action.time||''); card.appendChild(c); }
  if (data.stale_warning) { const w=document.createElement('p'); w.className='warning';
    w.setAttribute('role','alert'); w.textContent=data.stale_warning; card.appendChild(w); }
  if (data.recovery_notice) { const w=document.createElement('p'); w.className='warning';
    w.setAttribute('role','alert'); w.textContent=data.recovery_notice; card.appendChild(w); }
  (data.options||[]).forEach(o => { const b=document.createElement('button'); b.textContent=o;
    b.onclick = () => send(o); card.appendChild(b); });

  // Lab 4: the answer itself
  if (data.reply && !data.tool_confirmation && !data.tool_result) {
    const answer = document.createElement('p'); answer.textContent = data.reply; card.appendChild(answer);
  }
  // Lab 4: provenance beside the answer
  if (data.evidence && data.evidence.length) {
    const e = document.createElement('div'); e.className = 'card';
    e.innerHTML = '<strong>Evidence</strong>';
    data.evidence.forEach(h => {
      const p = document.createElement('p');
      p.textContent = (h.superseded ? '[SUPERSEDED | ' : '[') + h.source + ' | ' + h.section +
        ' | updated ' + h.date + ' | score ' + h.score + '] ' + h.text;
      e.appendChild(p);
    });
    card.appendChild(e);
  }
  // Lab 4: confirmation shows the arguments, then Confirm / Cancel
  if (data.tool_confirmation) {
    const p = document.createElement('p'); p.textContent = data.tool_confirmation; card.appendChild(p);
    const yes = document.createElement('button'); yes.textContent = 'Confirm';
    yes.onclick = () => send('__confirm_tool__'); card.appendChild(yes);
    const no = document.createElement('button'); no.textContent = 'Cancel';
    no.onclick = () => send('__cancel_tool__'); card.appendChild(no);
  }
  // Lab 4: report from what the tool returned, not from a model sentence
  if (data.tool_result) {
    const r = document.createElement('p'); r.textContent = 'Tool result: ' + JSON.stringify(data.tool_result);
    card.appendChild(r);
  }
    // Step 3: the signal card
  if (data.card) drawCard(data.card);
}
function line(parent, text, cls){
  const p=document.createElement('p'); if (cls) p.className=cls; p.textContent=text; parent.appendChild(p); return p;
}
function evidenceRow(e){
  const arrow = {positive:'▲ supports', negative:'▼ against', neutral:'• neutral'}[e.direction] || '• neutral';
  const p=document.createElement('p'); p.className='ev ' + e.direction;
  p.textContent = arrow + ': "' + e.text + '" (' + e.source + ', ' + e.date + ', ' + e.days_old + ' days ago)';
  return p;
}
function drawDetail(box, c){
  const d=document.createElement('div'); d.className='detail';
  const h1=document.createElement('h4'); h1.textContent='What I used: one vote per source'; d.appendChild(h1);
  const tbl=document.createElement('table');
  tbl.innerHTML='<tr><th>Source</th><th>Date</th><th>Vote</th></tr>';
  c.breakdown.forEach(b => { const r=tbl.insertRow();
    r.insertCell().textContent=b.section; r.insertCell().textContent=b.date;
    r.insertCell().textContent={1:'▲ up', '-1':'▼ down', 0:'• neutral'}[b.vote]; });
  d.appendChild(tbl);
  line(d, 'Rule: ' + c.rule);
  const h2=document.createElement('h4'); h2.textContent='What I did not use'; d.appendChild(h2);
  c.not_used.forEach(s => line(d, '• ' + s));
  const h3=document.createElement('h4'); h3.textContent='How to change the result'; d.appendChild(h3);
  line(d, 'Start over to pick another stock or holding period. If a source looks wrong or out of date, do not rely on this signal.');
  box.appendChild(d);
}
function drawCard(c){
  lastCard = c;
  card.innerHTML = '';
  const box=document.createElement('div'); box.className='signal';
  const head=document.createElement('h3');
  head.textContent = c.ticker + ': ' + c.signal + ' · ' + c.confidence + ' confidence';
  box.appendChild(head);
  line(box, c.reason);
  line(box, 'Holding period: ' + c.horizon + '. Not yet used to weight the evidence [planned].', 'note');
  c.stale.forEach(s => line(box, s, 'warning').setAttribute('role', 'alert'));
  if (c.top.length) {
    const h=document.createElement('h4'); h.textContent='Evidence (newest first)'; box.appendChild(h);
    c.top.forEach(e => box.appendChild(evidenceRow(e)));
  }
  if (c.all.length > c.top.length) {
    const d=document.createElement('details'), s=document.createElement('summary');
    s.textContent='Show all evidence (' + c.all.length + ')'; d.appendChild(s);
    c.all.forEach(e => d.appendChild(evidenceRow(e))); box.appendChild(d);
  }
  const toggle=document.createElement('button');
  toggle.textContent = detailed ? 'Hide how this signal was made' : 'Show how this signal was made';
  toggle.onclick = () => { detailed = !detailed; drawCard(lastCard); };
  box.appendChild(toggle);
  if (detailed) drawDetail(box, c);
  line(box, 'This is a signal, not advice. The decision is yours.', 'note');
  line(box, 'Simulated: ' + c.simulated, 'note');
  card.appendChild(box);
  const again=document.createElement('button'); again.textContent='Start over';
  again.onclick = () => send('Start over'); card.appendChild(again);
}
async function send(text){
  if (!text.startsWith('__')) say(text, true);
  const r = await fetch('/', {method:'POST', body: JSON.stringify({message:text})});
  const data = await r.json();
  say(data.reply); render(data);
}
document.getElementById('msg').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) { const v=e.target.value; e.target.value=''; send(v); }
});
</script>
